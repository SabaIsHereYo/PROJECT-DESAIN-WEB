<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun - IndieArc</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>

  <header class="kepala-web">
    <div class="wadah baris-nav">
      <a href="Index.html" class="logo">Indie<span>Arc</span></a>
      <nav class="menu-nav">
        <a href="Index.html">Kembali ke Beranda</a>
      </nav>
    </div>
  </header>

  <main class="wadah wadah-auth">
    <section class="kotak-auth">
      <h1>Buat Akun IndieArc</h1>
      <p class="teks-redup">Bergabung sebagai pemain game indie atau kreator studio.</p>

      <form id="formRegister" class="form-auth">
        <div class="grup-input">
          <label for="regUsername">Username / Nama Studio</label>
          <input type="text" id="regUsername" placeholder="contoh: NusantaraDev" required>
        </div>

        <div class="grup-input">
          <label for="regEmail">Alamat Email</label>
          <input type="email" id="regEmail" placeholder="nama@email.com" required>
        </div>

        <div class="grup-input">
          <label for="regPassword">Kata Sandi</label>
          <input type="password" id="regPassword" placeholder="Minimal 6 karakter" minlength="6" required>
        </div>

        <div class="grup-input">
          <label for="regKonfirmasi">Ulangi Kata Sandi</label>
          <input type="password" id="regKonfirmasi" placeholder="Ketik ulang kata sandi" required>
        </div>

        <fieldset class="pilihan-role">
          <legend>Jenis Akun Awal</legend>
          <label class="opsi-radio">
            <input type="radio" name="roleRegister" value="user" checked>
            <span>User / Gamer</span>
          </label>
          <label class="opsi-radio">
            <input type="radio" name="roleRegister" value="developer">
            <span>Indie Developer / Studio</span>
          </label>
        </fieldset>

        <button type="submit" class="tombol tombol-utama tombol-penuh">Daftar Akun</button>
      </form>

      <p class="catatan-bawah">
        Sudah punya akun? <a href="Login.html">Masuk di sini</a>
      </p>
    </section>
  </main>

  <footer class="kaki-web">
    <div class="wadah">
      <p>&copy; 2026 IndieArc - Global Indie Gaming &amp; Developer Hub.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
